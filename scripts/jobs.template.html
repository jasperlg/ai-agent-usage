<!DOCTYPE html>
<!-- SOURCE TEMPLATE. Rendered to ../jobs.html by scripts/jobs.py.
     Edit this file; jobs.html is generated. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheduled jobs on this Mac</title>
<style>
/* Same tokens as dashboard.template.html so the two read as one system. */
:root {
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.10);
  --good:#0ca30c; --warn:#c98500; --bad:#e66767; --mine:#3987e5;
}
:root[data-theme="light"] {
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.10);
  --good:#006300; --warn:#8a5c00; --bad:#c0342f; --mine:#2a78d6;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body {
  background:var(--page); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 72px;
}
.wrap { max-width:1360px; margin:0 auto; padding:0 24px; }

.top {
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--page) 88%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.top-in { display:flex; align-items:center; gap:20px; padding:16px 0; flex-wrap:wrap; }
.brand { display:flex; align-items:baseline; gap:12px; margin-right:auto; }
.brand h1 { font-size:17px; font-weight:650; margin:0; letter-spacing:-.01em; }
.brand .dot { width:7px; height:7px; border-radius:50%; background:var(--mine); flex:none;
              align-self:center; box-shadow:0 0 0 3px color-mix(in srgb,var(--mine) 20%,transparent); }
.brand .meta { color:var(--muted); font-size:12.5px; }

.seg { display:inline-flex; background:var(--surface-2); border:1px solid var(--border);
       border-radius:9px; padding:2px; gap:2px; }
.seg button {
  appearance:none; border:0; background:transparent; color:var(--ink-2);
  font:inherit; font-size:12.5px; padding:5px 11px; border-radius:7px; cursor:pointer;
}
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.25); }
input[type="search"] {
  appearance:none; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; color:var(--ink); font:inherit; font-size:13px; padding:6px 11px; min-width:210px;
}

/* ---- summary strip ---- */
.tiles { display:flex; gap:12px; flex-wrap:wrap; margin:22px 0 10px; }
.tile {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:13px 16px; min-width:132px;
}
.tile .n { font-size:23px; font-weight:640; letter-spacing:-.02em; }
.tile .k { color:var(--muted); font-size:12px; margin-top:1px; }
.tile.alert .n { color:var(--bad); }

h2 {
  font-size:13px; font-weight:640; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); margin:30px 0 9px;
}
h2 .sub { text-transform:none; letter-spacing:0; font-weight:400; margin-left:8px; }

/* table-layout:fixed is load-bearing. These cells hold 64-character labels and
   120-character absolute paths; with auto layout the browser widens columns to
   fit them, overflows the page, and then wraps the loser one character per line. */
.tw { border:1px solid var(--border); border-radius:12px; background:var(--surface);
      overflow-x:auto; }
/* The floor is set by the actions cell: two nowrap buttons need ~150px, and a
   fixed-layout cell narrower than its content overflows *leftwards* over the
   status pill rather than wrapping. Below this the wrapper scrolls instead. */
table { width:100%; min-width:880px; border-collapse:collapse; table-layout:fixed; }
thead th {
  text-align:left; font-size:11.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; color:var(--muted); padding:9px 13px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td { padding:9px 13px; border-top:1px solid var(--grid); vertical-align:middle; }
tbody tr:hover { background:var(--surface-2); }

/* Every long value truncates to one line and carries the full text in a
   tooltip, so row height is uniform and nothing can push the table wider. */
.trunc { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jobline { display:flex; align-items:center; gap:7px; }
.jobline .lbl { font-weight:560; min-width:0; }
.cmd { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
       color:var(--muted); margin-top:2px; }
/* Schedules wrap rather than truncate: "Wednesdays at 19:35" ellipsised to
   "Wednesdays at 19…" would hide the one thing the column exists to show. */
.when { white-space:normal; }
.ago { color:var(--muted); font-size:12px; white-space:nowrap; }
td.act { text-align:right; padding-left:0; white-space:nowrap; }

.pill {
  display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px;
  border:1px solid transparent; white-space:nowrap;
}
.pill.ok    { color:var(--good); border-color:color-mix(in srgb,var(--good) 45%,transparent);
              background:color-mix(in srgb,var(--good) 12%,transparent); }
.pill.warn  { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent);
              background:color-mix(in srgb,var(--warn) 12%,transparent); }
.pill.bad   { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent);
              background:color-mix(in srgb,var(--bad) 14%,transparent); }
.pill.idle  { color:var(--muted); border-color:var(--border); background:var(--surface-2); }
.pill.mine  { color:var(--mine); border-color:color-mix(in srgb,var(--mine) 45%,transparent);
              background:color-mix(in srgb,var(--mine) 12%,transparent); }

/* ---- expandable detail ---- */
[hidden] { display:none !important; }
.exp { appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
       font:inherit; font-size:10px; line-height:1; padding:3px; flex:none;
       transition:transform .12s ease; }
.exp[aria-expanded="true"] { transform:rotate(90deg); color:var(--ink); }
tr.det > td { padding:2px 13px 18px; background:var(--surface-2); }
.det h3 { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
          margin:15px 0 5px; font-weight:640; }
.det h3 span { text-transform:none; letter-spacing:0; font-weight:400;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
/* max-height + overflow is what keeps a 200-line script from taking over the page. */
.det pre {
  margin:0; max-height:330px; overflow:auto; white-space:pre; tab-size:4;
  background:var(--page); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px; line-height:1.5; color:var(--ink-2);
}
.fmeta { color:var(--muted); font-size:11.5px; margin:0 0 6px; }
.fnote { color:var(--warn); font-size:11.5px; margin:6px 0 0; }
.fmiss { color:var(--bad); font-size:12px; margin:0; }

.abtn { background:none; border:1px solid var(--border); border-radius:7px; color:var(--ink-2);
        font:inherit; font-size:11.5px; padding:3px 9px; cursor:pointer; white-space:nowrap; }
.abtn:hover { color:var(--ink); border-color:var(--muted); }
.abtn.copied { color:var(--good); border-color:var(--good); }
.abtn + .abtn { margin-left:6px; }

.note { color:var(--muted); font-size:12.5px; margin:14px 0 0; max-width:70ch; }
.empty { color:var(--muted); padding:18px 13px; }

/* Shown only when this page has gone stale, which is itself the signal that the
   job regenerating it has stopped. */
.age {
  display:none; margin:22px 0 0; padding:12px 15px; border-radius:11px;
  font-size:13px; line-height:1.5;
  color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 11%,transparent);
}
.age.show { display:block; }
.age code { color:inherit; }
</style>
</head>
<body>

<div class="top"><div class="wrap top-in">
  <div class="brand">
    <span class="dot"></span>
    <h1>Scheduled jobs</h1>
    <span class="meta" id="meta"></span>
  </div>
  <input type="search" id="q" placeholder="Filter by name or command…">
  <div class="seg" id="filter">
    <button data-f="timed" aria-pressed="true">On a timer</button>
    <button data-f="all" aria-pressed="false">Everything</button>
  </div>
  <div class="seg" id="theme">
    <button data-t="dark" aria-pressed="true">Dark</button>
    <button data-t="light" aria-pressed="false">Light</button>
  </div>
</div></div>

<div class="wrap">
  <div class="age" id="age"></div>
  <div class="tiles" id="tiles"></div>
  <div id="groups"></div>
  <p class="note" id="note"></p>
</div>

<script>
/*__JOBS_DATA__*/

(function () {
  var D = window.JOBS_DATA, root = document.documentElement;
  var state = { f: 'timed', q: '' };

  document.getElementById('meta').textContent =
    D.generated_at.replace('T', ' ').slice(0, 16) + ' · ' + D.host;

  // This page is written by the same daily job it reports on, so every row's
  // "last output" would read "just now" no matter what. The page's own age is
  // the signal that survives: if the job stopped, nothing regenerates this file.
  // Measured against the browser's live clock, so it keeps working unattended.
  (function () {
    var days = (Date.now() - new Date(D.generated_at).getTime()) / 86400000;
    if (!(days > 1.5)) return;
    var el = document.getElementById('age');
    el.className = 'age show';
    el.innerHTML = 'This page was generated <strong>' + Math.floor(days) + ' days ago</strong>. ' +
      'It is rewritten by ' + esc(D.self_label) + ' on every run, so if that is stale the job ' +
      'itself has probably stopped. Check it with <code>launchctl print gui/$UID/' +
      esc(D.self_label) + '</code>.';
  })();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function statusPill(j) {
    if (j.status_unknown)   return '<span class="pill idle" title="Root-domain job: ' +
                                   'launchctl cannot report on it without sudo">unknown</span>';
    if (!j.loaded)          return '<span class="pill idle">not loaded</span>';
    if (j.last_exit > 0)    return '<span class="pill bad">exit ' + j.last_exit + '</span>';
    if (j.running)          return '<span class="pill ok">running now</span>';
    if (j.stale)            return '<span class="pill warn">stale</span>';
    if (j.last_exit === 0)  return '<span class="pill ok">ok</span>';
    return '<span class="pill idle">loaded</span>';
  }

  function kb(n) {
    if (n == null) return '';
    return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 102400 ? 1 : 0) + ' KB';
  }

  // The answer to "what is this job actually doing": its own declaration, then
  // each file it runs -- and for a wrapper like /bin/sh, the script behind it.
  function details(j) {
    var h = '<div class="det-in">';
    h += '<h3>Declares <span>' + esc(j.plist_path) + '</span></h3>' +
         '<pre>' + esc(j.plist) + '</pre>';

    (j.files || []).forEach(function (f, i) {
      h += '<h3>' + (i ? 'Script it runs' : 'Executable') +
           ' <span>' + esc(f.path) + '</span></h3>';
      if (f.missing) {
        h += '<p class="fmiss">This file does not exist. The job would fail if it fired.</p>';
        return;
      }
      var meta = [f.kind === 'text' ? 'text' : 'binary', kb(f.bytes)];
      if (f.signature) meta.push('signed by ' + f.signature);
      h += '<p class="fmeta">' + esc(meta.join('  ·  ')) + '</p>';
      if (f.unreadable) {
        h += '<p class="fmiss">Not readable with your permissions.</p>';
      } else if (f.text) {
        h += '<pre>' + esc(f.text) + '</pre>';
      } else {
        h += '<p class="fmeta">Compiled binary — there is no source to show. ' +
             'The signature above is what identifies who built it.</p>';
      }
      if (f.truncated) h += '<p class="fnote">Truncated: ' + esc(f.truncated) + '.</p>';
    });

    if (!(j.files || []).length) {
      h += '<h3>Executable</h3><p class="fmiss">This plist names no program to run.</p>';
    }
    if (j.log) {
      h += '<h3>Writes its output to</h3><pre>' + esc(j.log) + '</pre>';
    }
    return h + '</div>';
  }

  function visible(j) {
    if (state.f === 'timed' && !j.timed) return false;
    if (!state.q) return true;
    var hay = (j.label + ' ' + j.command + ' ' + j.path).toLowerCase();
    return hay.indexOf(state.q) !== -1;
  }

  function render() {
    var shown = D.jobs.filter(visible);

    var timed = D.jobs.filter(function (j) { return j.timed; });
    var broken = D.jobs.filter(function (j) { return j.last_exit > 0 || j.stale; });
    var tiles = [
      { n: timed.length, k: 'on a timer' },
      { n: D.jobs.filter(function (j) { return j.mine; }).length, k: 'yours' },
      { n: D.jobs.length - timed.length, k: 'on demand / at login' },
      { n: broken.length, k: 'needing a look', alert: broken.length > 0 }
    ];
    document.getElementById('tiles').innerHTML = tiles.map(function (t) {
      return '<div class="tile' + (t.alert ? ' alert' : '') + '"><div class="n">' + t.n +
             '</div><div class="k">' + t.k + '</div></div>';
    }).join('');

    var html = '';
    D.groups.forEach(function (g) {
      var rows = shown.filter(function (j) { return j.group === g.key; });
      if (!rows.length) return;
      html += '<h2>' + esc(g.title) + '<span class="sub">' + esc(g.sub) + '</span></h2>' +
        '<div class="tw"><table><colgroup>' +
          '<col style="width:35%"><col style="width:13%"><col style="width:14%">' +
          '<col style="width:9%"><col style="width:9%"><col style="width:20%">' +
        '</colgroup><thead><tr><th>Job</th><th>Trigger</th><th>Next</th>' +
        '<th>Last output</th><th>Status</th><th></th></tr></thead><tbody>' +
        rows.map(function (j) {
          // The plist path is dropped: the group heading already names its
          // directory, and the filename only ever restates the label.
          return '<tr class="row">' +
            '<td><div class="jobline">' +
                  '<button class="exp" aria-expanded="false" ' +
                    'title="Show what this job declares and the code it runs">&#9654;</button>' +
                  '<span class="lbl trunc" title="' + esc(j.label) + '">' + esc(j.label) + '</span>' +
                  (j.mine ? '<span class="pill mine">yours</span>' : '') +
                '</div>' +
                '<span class="cmd trunc" title="' + esc(j.command) + '">' + esc(j.command) + '</span></td>' +
            '<td class="when">' + esc(j.trigger) + '</td>' +
            '<td class="when">' + esc(j.next || '—') + '</td>' +
            '<td class="ago">' + esc(j.last_output || '—') + '</td>' +
            '<td>' + statusPill(j) + '</td>' +
            '<td class="act">' +
              '<button class="abtn" data-cmd="' + esc(j.run) + '" data-label="run now…" ' +
                'title="Copy a command that starts this job now, waits for it to ' +
                'finish, prints what it wrote to its log, and rewrites this page">' +
                'run now…</button>' +
              '<button class="abtn" data-cmd="' + esc(j.uninstall) + '" data-label="remove…" ' +
                'title="Copy a one-line command that unloads this job, deletes its ' +
                'plist (asking for your password if it is root-owned) and rewrites ' +
                'this page">remove…</button></td>' +
          '</tr>' +
          '<tr class="det" hidden><td colspan="6">' + details(j) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    });
    document.getElementById('groups').innerHTML =
      html || '<p class="empty">Nothing matches that filter.</p>';

    document.getElementById('note').textContent = D.note;
  }

  document.getElementById('q').addEventListener('input', function (e) {
    state.q = e.target.value.trim().toLowerCase(); render();
  });
  document.getElementById('filter').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.f = b.dataset.f;
    [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
    render();
  });
  document.getElementById('theme').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    root.setAttribute('data-theme', b.dataset.t);
    [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
  });
  // This page is normally opened by double-clicking it, and navigator.clipboard
  // is unreliable on file:// (Safari refuses it outright). Fall back to a hidden
  // textarea, then to a prompt the user can copy out of by hand -- a dead button
  // would be worse than an ugly one.
  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { return navigator.clipboard.writeText(s); } catch (err) { /* fall through */ }
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = s; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy blocked'));
    });
  }

  // Expand on the caret or anywhere on the row, except the action buttons.
  document.getElementById('groups').addEventListener('click', function (e) {
    if (e.target.closest('.abtn')) return;
    var row = e.target.closest('tr.row'); if (!row) return;
    var det = row.nextElementSibling;
    if (!det || !det.classList.contains('det')) return;
    var open = det.hasAttribute('hidden');
    if (open) det.removeAttribute('hidden'); else det.setAttribute('hidden', '');
    var caret = row.querySelector('.exp');
    if (caret) caret.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('.abtn'); if (!b) return;
    var cmd = b.dataset.cmd, label = b.dataset.label;
    copyText(cmd).then(function () {
      b.classList.add('copied'); b.textContent = 'copied';
      setTimeout(function () { b.classList.remove('copied'); b.textContent = label; }, 1400);
    }).catch(function () {
      window.prompt('Run this in Terminal:', cmd);
    });
  });

  render();
})();
</script>
</body>
</html>
